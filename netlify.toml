[build]
  command = "npm run build"
  publish = "dist"

# API routes → Netlify Function (same origin, rewrite so the URL stays /api/*)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback — let React Router handle /login, /, etc.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
